<section class="preparation" aria-labelledby="ready-title"><p class="eyebrow"><span></span>潜航准备 / DIVE 01</p><h1 id="ready-title">下一束微光，<br>在更深处。</h1><p class="intro">坐进微光号，让海面慢慢远去。<br>不必赶路，深海值得慢慢看。</p><div class="mission"><div><small>目的地</small><strong>深渊海床</strong></div><div><small>目标深度</small><strong>6,000 <em>m</em></strong></div><div><small>航行方式</small><strong>轻松探索</strong></div></div><button class="launch" id="launch">开始下潜 <span>↓</span></button><p class="edition">场景体验版 · 先看看沿途风景</p></section>
